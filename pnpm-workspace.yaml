packages:
  - ./packages/core
  - ./packages/cells
  - ./packages/source

# Keep every workspace on the same React runtime.
catalog:
  react: 19.2.0
  react-dom: 19.2.0

  # Shared build and lint tools; catalog entries do not force transitive versions.
  "eslint": "9.39.3"
  "@linaria/react": "^6.3.0"
  "@wyw-in-js/cli": "^1.0.6"
  "baseline-browser-mapping": "^2.10.8"
  "eslint-plugin-import": "^2.32.0"
  "eslint-plugin-react": "^7.37.5"
  "eslint-plugin-react-hooks": "^7.0.1"
  "typedoc": "^0.28.14"
  "typescript": "^5.9.3"

overrides:
  react: "catalog:"
  react-dom: "catalog:"

# esbuild installs/verifies the native binary used by Vite and Storybook.
allowBuilds:
  esbuild: true
