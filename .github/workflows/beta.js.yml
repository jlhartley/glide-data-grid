name: Beta CI

# Deliberate opt-in only; pushing a tag never publishes a package.
on:
    workflow_dispatch:
        inputs:
            tag:
                description: Existing version tag to publish (beta)
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: github-packages-publish
    cancel-in-progress: false

env:
    CI: true

jobs:
    publish:
        if: github.repository == 'jlhartley/glide-data-grid' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ inputs.tag }}
                  fetch-depth: 0
                  persist-credentials: false
            - name: Validate tag and publication destination
              env:
                  RELEASE_TAG: ${{ inputs.tag }}
                  RELEASE_CHANNEL: beta
              run: node .github/scripts/validate-release.cjs
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: '22'
                  package-manager-cache: false
            - run: corepack enable && pnpm --version
            - run: pnpm install --frozen-lockfile
            - id: build
              run: pnpm run build
            - run: pnpm run lint
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: pnpm run test --run --coverage
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: pnpm run test-source --run
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: pnpm run test-cells --run
            # Configure auth only after validation; v7 no longer supplies a dummy token.
            - name: Configure GitHub Packages authentication
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: '22'
                  package-manager-cache: false
                  registry-url: https://npm.pkg.github.com
                  scope: '@jlhartley'
            - name: Publish the three fork packages to GitHub Packages
              run: pnpm --filter './packages/*' -r publish --registry=https://npm.pkg.github.com --access=restricted --tag=beta --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
