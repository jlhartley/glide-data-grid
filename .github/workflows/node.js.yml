name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
    contents: read

env:
    CI: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - name: Enable repository pnpm version
              run: corepack enable && pnpm --version
            - name: Install locked dependencies
              run: pnpm install --frozen-lockfile
            - id: build
              run: pnpm run build
            - run: pnpm run lint
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: pnpm run test --run --coverage
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: core-coverage
                  path: packages/core/coverage
                  if-no-files-found: ignore
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: pnpm run test-source --run
            - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              run: pnpm run test-cells --run
            # These standalone legacy consumers retain their own npm lockfiles.
            - run: pnpm run test-projects
    react-compatibility:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                react: [18, 19]
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - name: Enable repository pnpm version
              run: corepack enable && pnpm --version
            - name: Install locked dependencies
              run: pnpm install --frozen-lockfile
            - run: pnpm run test-${{ matrix.react }}
